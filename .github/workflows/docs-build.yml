name: Docs

# Builds the documentation site in docs/. The API reference is generated from
# openapi.yaml, so a spec change rebuilds the docs too — this is a second
# consumer of spec correctness alongside code-quality.yml's Spectral lint.
#
# The Go workflows (tests.yml, code-quality.yml) are path-filtered to Go and
# spec files, so a docs-only change does not run them.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'openapi.yaml'
      - '.github/workflows/docs-build.yml'

concurrency:
  group: docs-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # package_json_file is relative to the repo root, not to
      # defaults.run.working-directory, and the root has no package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: docs/package.json

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types and content collections
        run: pnpm check

      # No STAINLESS_API_KEY, and no secrets of any kind: the build must be
      # self-contained. This job failing on a missing credential would mean the
      # vendor coupling we removed in ENG-2369 has crept back in.
      - name: Build
        run: pnpm build
