name: Build & release Formbricks Hub Docker images

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check-release:
    name: Verify stable release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      is_stable: ${{ steps.check_stable.outputs.is_stable }}
      is_latest: ${{ steps.compare_tags.outputs.is_latest }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check if stable release
        id: check_stable
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            echo "Skipping: this is a prerelease"
            echo "is_stable=false" >> $GITHUB_OUTPUT
          else
            echo "This is a stable release"
            echo "is_stable=true" >> $GITHUB_OUTPUT
          fi

      # is_latest moves GHCR :latest and ECR :latest/production, so the script grants it only on a
      # well-formed answer from the API: an API error or a malformed response fails this job (and
      # skips both image pushes) instead of defaulting either way.
      - name: Checkout the release scripts
        if: steps.check_stable.outputs.is_stable == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Check this release against the latest release
        if: steps.check_stable.outputs.is_stable == 'true'
        id: compare_tags
        env:
          CURRENT_TAG: ${{ github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/resolve-latest-release.sh

  docker-build-ghcr:
    name: Build & push to GitHub Container Registry
    needs: check-release
    if: needs.check-release.outputs.is_stable == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/release-docker-ghcr.yml
    secrets: inherit
    with:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      MAKE_LATEST: ${{ needs.check-release.outputs.is_latest == 'true' }}

  docker-build-ecr:
    name: Build & push to AWS ECR
    needs:
      - check-release
      - docker-build-ghcr
    if: needs.check-release.outputs.is_stable == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-and-push-ecr.yml
    secrets: inherit
    with:
      image_tag: ${{ needs.docker-build-ghcr.outputs.VERSION }}
      MAKE_LATEST: ${{ needs.check-release.outputs.is_latest == 'true' }}

  verify-release:
    name: Verify release outputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - docker-build-ghcr
      - docker-build-ecr
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Display release summary
        env:
          GHCR_VERSION: ${{ needs.docker-build-ghcr.outputs.VERSION }}
          ECR_IMAGE_TAG: ${{ needs.docker-build-ecr.outputs.IMAGE_TAG }}
          ECR_TAGS: ${{ needs.docker-build-ecr.outputs.TAGS }}
        run: |
          set -euo pipefail

          echo "✅ Formbricks Hub Release Completed Successfully"
          echo ""
          echo "GHCR Version: ${GHCR_VERSION}"
          echo ""
          echo "ECR Image Tag: ${ECR_IMAGE_TAG}"
          echo "ECR Tags:"
          printf '%s\n' "${ECR_TAGS}"
