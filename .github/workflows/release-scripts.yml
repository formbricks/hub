name: Release scripts

# Tests the scripts the release workflow runs with credentials (.github/scripts), on every pull
# request that could change them or how hub-release.yml calls them.
#
# `pull_request`, never `pull_request_target`: the job runs PR-controlled scripts, so it gets a
# read-only token and no secrets.

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/hub-release.yml'
      - '.github/workflows/release-scripts.yml'

permissions:
  contents: read

concurrency:
  group: release-scripts-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test release scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Tests
        run: node --test '.github/scripts/*.test.mjs'
