name: Release scripts

# Tests the scripts the release workflow runs with credentials (.github/scripts), on every pull
# request that could change them or how hub-release.yml calls them.
#
# `pull_request`, never `pull_request_target`: the job runs PR-controlled scripts, so it gets a
# read-only token and no secrets.

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/hub-release.yml'
      - '.github/workflows/release-scripts.yml'

permissions:
  contents: read

concurrency:
  group: release-scripts-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test release scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Tests
        run: node --test '.github/scripts/*.test.mjs'

      # The tests use a stub API. This asks the real one, with the same read-only GITHUB_TOKEN the
      # release job gets, about this repository's current latest release: it must come back true,
      # proving that token can read isLatest and that GraphQL agrees with the release list.
      - name: Live check against the latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          CURRENT_TAG="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          output="$(mktemp)"
          CURRENT_TAG="${CURRENT_TAG}" GITHUB_OUTPUT="${output}" bash .github/scripts/resolve-latest-release.sh

          if [[ "$(cat "${output}")" != "is_latest=true" ]]; then
            echo "::error::The resolver did not report the latest release as latest."
            exit 1
          fi
