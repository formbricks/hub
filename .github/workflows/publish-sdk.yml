name: Publish TypeScript SDK

# Generates @formbricks/hub from openapi.yaml and publishes it to npm on a stable
# Hub release. The SDK is a build artifact — nothing generated is committed — so
# this workflow is the only place it is produced.
#
# SECURITY: this file's name is part of npm's trusted-publisher binding
# (formbricks/hub + publish-sdk.yml + the npm-publish environment). Do not rename
# it without updating the npm configuration, and do not add a pull_request-family
# trigger here: PR-time generation lives in sdk-preview.yml, which holds no
# credentials. See AGENTS.md -> TypeScript SDK.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and compare, but do not publish"
        type: boolean
        default: true

# Least privilege by default; the publish job opts into id-token explicitly.
permissions:
  contents: read

concurrency:
  group: publish-sdk-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  # Runs third-party code (the generator, its dependencies, the build) and so
  # deliberately holds NO publishing credential. Everything it produces is handed
  # to the publish job as an artifact.
  build:
    name: Generate, test and pack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/typescript
    outputs:
      should_publish: ${{ steps.compare.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Skip prereleases
        if: github.event_name == 'release' && github.event.release.prerelease == true
        run: |
          echo "This is a prerelease; the SDK follows the same rule as the Docker builds."
          exit 1

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # Relative to the repo root, not to defaults.run.working-directory.
          package_json_file: sdks/typescript/package.json

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml

      # --ignore-scripts: nothing here needs a native build step, and lifecycle
      # scripts are the entry point for install-time supply-chain attacks.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Read the target version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Target version: $VERSION"

      - name: Generate and build
        run: pnpm build

      - name: Type check
        run: ./node_modules/.bin/tsc --noEmit

      # Pins the regression that motivated leaving the previous generator:
      # array filters must go out as repeated query parameters.
      - name: Wire tests
        run: node --test 'tests/*.test.mjs'

      - name: Pack
        run: |
          set -euo pipefail
          npm pack --pack-destination ./.pack
          ls -la ./.pack

      # The core of the artifact model. With nothing committed there is no diff to
      # read, so the published tarball IS the baseline: if the generated surface is
      # unchanged, a Hub release that only touched Go must not burn an SDK version.
      - name: Compare against the published package
        id: compare
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p .compare && cd .compare

          if ! npm view @formbricks/hub version >/dev/null 2>&1; then
            echo "Package not published yet — publishing."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PUBLISHED="$(npm view @formbricks/hub version)"
          echo "Published latest: $PUBLISHED / building: $VERSION"

          npm pack "@formbricks/hub@$PUBLISHED" --pack-destination . >/dev/null
          tar -xzf ./*.tgz            # extraction only: never install or execute it

          if diff -r package/src ../src >/dev/null 2>&1; then
            echo "::notice::Generated SDK is identical to @formbricks/hub@$PUBLISHED — skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Generated surface differs from $PUBLISHED."
          diff -r package/src ../src | head -100 >> "$GITHUB_STEP_SUMMARY" || true

          # A changed surface with a version that already exists is a forgotten
          # bump. Fail loudly rather than skipping silently or overwriting.
          if npm view "@formbricks/hub@$VERSION" version >/dev/null 2>&1; then
            echo "::error::The SDK surface changed but version $VERSION is already on npm. Bump the version in sdks/typescript/package.json."
            exit 1
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Upload the packed tarball
        if: steps.compare.outputs.should_publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: sdks/typescript/.pack/*.tgz
          retention-days: 7
          if-no-files-found: error

  # Holds the publish credential and nothing else: it downloads a tarball and
  # runs npm publish. No checkout, no install, no repo or dependency code runs
  # here, so a compromised dev dependency in the build job cannot reach npm.
  publish:
    name: Publish to npm
    needs: build
    if: needs.build.outputs.should_publish == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Gates the OIDC token behind branch/tag protection rules. npm's
    # trusted-publisher binding does not include a ref, so this environment is
    # what stops any branch from publishing.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Download the packed tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: .

      # Trusted publishing requires npm >= 11.5.1 and Node >= 22.14.0; the
      # runner's bundled npm can be older, so pin one explicitly.
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Pin an OIDC-capable npm
        run: npm install -g npm@11.6.2

      # No NPM_TOKEN anywhere: authentication is OIDC via the trusted publisher,
      # and provenance is generated automatically for a public package from a
      # public repo. A missing credential must fail, never fall back to a token.
      - name: Publish
        run: |
          set -euo pipefail
          TARBALL="$(ls ./*.tgz)"
          echo "Publishing $TARBALL as version ${{ needs.build.outputs.version }}"
          npm publish "$TARBALL" --access public --tag latest

      - name: Confirm provenance landed
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          for i in $(seq 1 10); do
            if npm view "@formbricks/hub@$VERSION" dist.attestations >/dev/null 2>&1; then
              npm view "@formbricks/hub@$VERSION" dist.attestations
              exit 0
            fi
            sleep 10
          done
          echo "::warning::No provenance attestation visible for $VERSION yet; check npmjs.com."
