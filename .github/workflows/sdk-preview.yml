name: SDK preview

# Shows what a spec change does to the published SDK surface. The generated SDK is
# not committed, so a PR touching openapi.yaml otherwise says nothing about its
# effect on @formbricks/hub — this is the replacement for the preview the previous
# generator's action used to comment on every PR.
#
# SECURITY: this job runs the generator over PR-controlled files (openapi.yaml, and
# the generator config and lockfile when sdks/** is touched), so it is treated as
# executing untrusted code:
#   - `pull_request`, never `pull_request_target` (which would hand fork content a
#     writable token and the base repo's secrets — GitHub's "pwn request").
#   - read-only permissions, no secrets, no environment.
#   - --ignore-scripts on install.
#   - output goes to the job summary rather than a PR comment, so no write token is
#     needed anywhere. If a comment is ever wanted, the safe shape is an artifact
#     plus a separate workflow_run job that never checks out the PR ref.

on:
  pull_request:
    paths:
      - 'openapi.yaml'
      - 'sdks/**'
      - '.github/workflows/sdk-preview.yml'

permissions:
  contents: read

concurrency:
  group: sdk-preview-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Diff the SDK surface
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/typescript

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: sdks/typescript/package.json

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate and build
        run: pnpm build

      - name: Type check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Wire tests
        run: node --test 'tests/*.test.mjs'

      # Compares the exported names against what is on npm today. A rename or a
      # removal here is a breaking change for consumers and should be visible in
      # review, not discovered after publish.
      - name: Diff the public surface against the published package
        run: |
          set -euo pipefail
          mkdir -p .compare && cd .compare

          if ! npm view @formbricks/hub version >/dev/null 2>&1; then
            echo "Package not published yet; nothing to compare." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          PUBLISHED="$(npm view @formbricks/hub version)"
          npm pack "@formbricks/hub@$PUBLISHED" --pack-destination . >/dev/null
          tar -xzf ./*.tgz          # extraction only: never installed or executed

          exports_of() {
            grep -rhoE '^export (const|function|type|interface) [A-Za-z0-9_]+' "$1" 2>/dev/null \
              | awk '{print $3}' | sort -u
          }
          exports_of package/src > published.txt || true
          exports_of ../src > generated.txt || true

          {
            echo "## SDK surface vs \`@formbricks/hub@$PUBLISHED\`"
            echo
            REMOVED="$(comm -23 published.txt generated.txt || true)"
            ADDED="$(comm -13 published.txt generated.txt || true)"

            if [ -z "$REMOVED" ] && [ -z "$ADDED" ]; then
              echo "No change to the exported surface."
            else
              if [ -n "$REMOVED" ]; then
                echo "### Removed or renamed — breaking for consumers"
                echo '```'; echo "$REMOVED"; echo '```'
              fi
              if [ -n "$ADDED" ]; then
                echo "### Added"
                echo '```'; echo "$ADDED"; echo '```'
              fi
              echo
              echo "If anything is listed as removed, bump the version in \`sdks/typescript/package.json\` accordingly."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
