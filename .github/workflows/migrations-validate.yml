name: Migrations Validate

# Runs goose validate to ensure migration files are well-formed (no database required)

on:
  pull_request:
    paths:
      - 'migrations/**'
      - '.github/workflows/migrations-validate.yml'

concurrency:
  group: migrations-validate-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.28.0

      - name: Validate migrations
        run: make migrate-validate
